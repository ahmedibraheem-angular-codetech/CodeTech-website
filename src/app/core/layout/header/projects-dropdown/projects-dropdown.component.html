@if (isOpen()) {
  <div class="projects-dropdown" role="region" [attr.aria-label]="'header.nav.projects' | translate">
    <div class="projects-list row g-2">
      @for (project of list(); track project.id) {
        <div class="col-md-4">
          <article class="project-card">
            <div class="project-media">
              <img
                class="project-image"
                [src]="project.imageUrl"
                [alt]="project.title"
                loading="lazy"
              />
              <div class="project-layer">
                <ct-button
                  class="ct-spread-fit"
                  [label]="'header.mega.viewProject' | translate"
                  icon="double-alt-arrow-left"
                  variant="light"
                  layout="spread"
                  width="140px"
                  height="36px"
                  fontSize="12px"
                  color="#EEF1F5"
                  textColor="#002951"
                  shadowColor=""
                  (clicked)="viewProject(project)"
                />
              </div>
            </div>
            <div class="project-body">
              <h3 class="project-title">{{ project.title }}</h3>
              <p class="project-desc">{{ project.description }}</p>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
}
