@if (status() === 'loading') {
  <section class="container py-5" aria-busy="true" aria-label="Loading">
    <ct-skeleton width="100%" height="18rem" radius="1rem" />
    <div class="mt-4 d-flex gap-3">
      <ct-skeleton width="100%" height="12rem" />
      <ct-skeleton width="100%" height="12rem" />
    </div>
  </section>
} @else if (status() === 'error') {
  <ct-page-error-state (retry)="retry()" />
} @else if (page(); as about) {
  <ct-page-hero
    [title]="'about.hero.title' | translate"
    [description]="'about.hero.description' | translate"
    [buttonLabel]="'about.hero.cta' | translate"
    (ctaClick)="goToContact()"
  />

  <ct-about-overview-section
    [data]="about.about"
    [philosophyTitle]="'about.overview.philosophy.title' | translate"
    [marketTitle]="'about.overview.market.title' | translate"
  />

  <ct-features-section
    [label]="'about.features.label' | translate"
    [title]="'about.features.title' | translate"
    [features]="featureItems"
    [translateKeys]="true"
  />

  <ct-about-vision-mission-section
    [data]="about.vision_mission"
    [label]="'about.visionMission.label' | translate"
    [title]="'about.visionMission.title' | translate"
    [visionTitle]="'about.visionMission.vision.title' | translate"
    [missionTitle]="'about.visionMission.mission.title' | translate"
  />

  <ct-about-values-section
    [items]="valueItems"
    [label]="'about.values.label' | translate"
    [title]="'about.values.title' | translate"
  />

  @if (about.partners.length) {
    <ct-clients-section
      [logos]="about.partners"
      [label]="'about.clients.label' | translate"
      [title]="'about.clients.title' | translate"
    />
  }

  <ct-about-founder-section
    [data]="about.ceo"
    [label]="'about.founder.label' | translate"
    [title]="'about.founder.title' | translate"
  />

  @if (about.team.length) {
    <ct-about-team-section
      [members]="about.team"
      [label]="'about.team.label' | translate"
      [title]="'about.team.title' | translate"
    />
  }

  @if (about.services.length) {
    <ct-services-section
      [showBackground]="false"
      [label]="'about.services.label' | translate"
      [title]="'about.services.title' | translate"
      [services]="about.services"
    />
  }
}
