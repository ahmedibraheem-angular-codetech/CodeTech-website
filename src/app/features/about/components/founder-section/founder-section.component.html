<section class="founder-section" aria-labelledby="about-founder-title">
  <div class="container">
    <ct-divider [label]="label()" />

    <h2 id="about-founder-title" class="founder-heading">
      {{ title() }}
    </h2>

   
  </div>
  <div class="row g-3 g-lg-4 align-items-stretch container-fix ">
    <div class="col-12 col-lg-6 d-flex">
      <div class="founder-visual">
        <img
          class="founder-image"
          [src]="data().imageSrc"
          [alt]="data().imageAlt | translate"
          loading="lazy"
          decoding="async"
        />
      </div>
    </div>

    <div class="col-12 col-lg-6 d-flex">
      <article
        class="founder-info"
        [style.background-image]="'url(' + data().cardBgSrc + ')'"
      >
        <div class="founder-info-body">
          <ct-divider
            [label]="data().role | translate"
            variant="white"
          />

          <h3 class="founder-name">{{ data().name | translate }}</h3>

          <p class="founder-description">
            {{ data().description | translate }}
          </p>
        </div>
