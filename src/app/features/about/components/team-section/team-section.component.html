<section class="team-section" aria-labelledby="about-team-title">
  <div class="container">
    <ct-divider [label]="label()" />

    <h2 id="about-team-title" class="team-heading">
      {{ title() }}
    </h2>

    <div class="row g-3">
      @for (member of members(); track member.id) {
        <div class="col-6 col-lg-3">
          <article class="team-card">
            <img
              class="team-card-mark"
              [src]="cardBgSrc"
              alt=""
              aria-hidden="true"
              loading="lazy"
              decoding="async"
            />

            <div class="team-card-copy">
              <span class="team-card-role">{{ member.job_title }}</span>
              <h3 class="team-card-name">{{ member.name }}</h3>
            </div>

            <div class="team-card-media">
              @if (member.photo?.url) {
                <img
                  class="team-card-image"
                  [src]="member.photo?.url"
                  [alt]="member.name"
                  loading="lazy"
                  decoding="async"
                />
              }
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
