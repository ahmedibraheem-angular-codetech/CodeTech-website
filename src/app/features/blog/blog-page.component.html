<ct-page-hero
  [title]="'blog.hero.title' | translate"
  [description]="'blog.hero.description' | translate"
/>

@if (status() === 'loading') {
  <section class="container py-5" aria-busy="true" aria-label="Loading">
    <ct-skeleton width="100%" height="24rem" radius="1rem" />
    <div class="mt-4">
      <ct-skeleton width="100%" height="20rem" radius="1rem" />
    </div>
  </section>
} @else if (status() === 'error') {
  <ct-page-error-state (retry)="retry()" />
} @else if (page(); as blog) {
  @if (blog.featured.length) {
    <ct-featured-articles-section
      [label]="'blog.featured.label' | translate"
      [title]="'blog.featured.title' | translate"
      [articles]="blog.featured"
    />
  }

  <ct-all-articles-section [categories]="blog.categories" />
}
