<section
  class="content-media-section"
  [attr.aria-labelledby]="data().id + '-title'"
>
  <div class="container">
    <div class="content-media-card">
      <div class="row align-items-stretch g-3">
        <div class="col-md-6 d-flex">
          <div class="content-media-visual">
            @if (data().image?.url) {
              <img
                class="content-media-image"
                [src]="data().image!.url"
                [alt]="data().title"
                loading="lazy"
                decoding="async"
              />
            }
          </div>
        </div>

        <div class="col-md-6">
          <div class="content-media-copy">
            <ct-divider [label]="data().label" />

            <h2 [id]="data().id + '-title'" class="content-media-title">
              {{ data().title }}
            </h2>

            <p class="content-media-description">
              {{ data().description }}
            </p>

            <ul class="content-media-list">
              @for (item of data().items; track $index) {
                <li class="content-media-list-item">
                  <span class="content-media-check" aria-hidden="true"></span>
                  <span>{{ item }}</span>
                </li>
              }
            </ul>

            @if (showButton()) {
              <ct-button
                class="content-media-cta"
                [label]="buttonLabel()"
                [icon]="buttonIcon()"
                variant="primary"
                layout="spread"
                fontWeight="500"
                (clicked)="onCtaClick()"
              />
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
