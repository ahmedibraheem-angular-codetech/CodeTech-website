<section class="home-hero">
  <div class="container">
    <div class="row home-hero-row align-items-end">
      <div class="col-12 col-lg-6 col-xl-5 home-hero-copy mb-5">
        <ct-divider [label]="data().brand | translate" variant="white" />
        <h1 class="hero-titile">
          @for (word of titleWords(); track $index + word) {
            <span class="hero-word" [style.animation-delay.s]="titleDelay($index)">{{ word }}</span>
            @if (!$last) {
              <span class="hero-word-gap">{{ ' ' }}</span>
            }
          }
        </h1>

        <p class="hero-description text-white">
          @for (word of descriptionWords(); track $index + word) {
            <span class="hero-word" [style.animation-delay.s]="descriptionDelay($index)">{{ word }}</span>
            @if (!$last) {
              <span class="hero-word-gap">{{ ' ' }}</span>
            }
          }
        </p>

        <div class="hero-buttons d-flex gap-3">
          <ct-button
            [label]="'home.ctaStart' | translate"
            variant="dark"
            icon="double-alt-arrow-left"
            layout="spread"
            fontWeight="500"
            (clicked)="goToContact()"
          />
          <ct-button
            [label]="'home.ctaExplore' | translate"
            variant="primary"
            icon="laptop"
            layout="spread"
            fontWeight="500"
            (clicked)="goToServices()"
          />
        </div>
      </div>
    </div>
  </div>
</section>
