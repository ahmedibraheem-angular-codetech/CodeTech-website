<section
  class="home-video-section"
  [attr.aria-label]="'home.video.label' | translate"
>
  <div class="container video-container">
    <div class="video-mosaic">
      @if (videoUrl()) {
        <video
          #homeVideo
          class="video-mosaic-image"
          [src]="videoUrl()"
          preload="auto"
          playsinline
          [muted]="!isPlaying()"
          [controls]="isPlaying()"
          (loadedmetadata)="onPreviewMetadataLoaded($event)"
          (timeupdate)="onPreviewTimeUpdate($event)"
          (ended)="onPreviewEnded($event)"
        ></video>
      }

      @if (videoUrl() && !isPlaying()) {
        <button
          type="button"
          class="video-play"
          [attr.aria-label]="'home.video.play' | translate"
          (click)="onPlay()"
        >
          <span class="video-play-icon" aria-hidden="true"></span>
        </button>
      }
    </div>
  </div>
</section>
