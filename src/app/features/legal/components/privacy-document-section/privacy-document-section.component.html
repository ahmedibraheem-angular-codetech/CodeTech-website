<section class="privacy-document-section">
  <div class="container">
    <p class="privacy-document-updated">
      {{ 'legal.updatedAt' | translate }}:
      <time [attr.datetime]="updatedAt()">{{ updatedAt() | localizedDate: lang() }}</time>
    </p>
    <div class="privacy-document-html" [innerHTML]="content()"></div>
  </div>
</section>
