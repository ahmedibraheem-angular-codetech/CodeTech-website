<section class="terms-document-section">
  <div class="container">
    <p class="terms-document-updated">
      {{ 'legal.updatedAt' | translate }}:
      <time [attr.datetime]="updatedAt()">{{ updatedAt() | localizedDate: lang() }}</time>

    <div class="terms-document-html" [innerHTML]="content()"></div>
  </div>
</section>
