<ct-page-hero
  [title]="'legal.terms.hero.title' | translate"
  [description]="'legal.terms.hero.description' | translate"
/>

@if (status() === 'loading') {
  <section class="container py-5" aria-busy="true" aria-label="Loading">
    <ct-skeleton width="100%" height="1.5rem" />
    <div class="mt-3">
      <ct-skeleton width="90%" height="1.5rem" />
    </div>
    <div class="mt-3">
      <ct-skeleton width="75%" height="1.5rem" />
    </div>
  </section>
} @else if (status() === 'error') {
  <ct-page-error-state (retry)="retry()" />
} @else if (document(); as legal) {
  <ct-terms-document-section [content]="legal.content" [updatedAt]="legal.updated_at" />
}
