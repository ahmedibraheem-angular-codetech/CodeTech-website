<section class="product-challenges" aria-labelledby="product-challenges-title">
  <div class="container">
    <header class="product-challenges-intro">
      <ct-divider [label]="label()" />
      <h2 id="product-challenges-title" class="product-challenges-title">{{ title() }}</h2>
    </header>

    <ul class="product-challenges-grid">
      @for (item of items(); track item.id; let i = $index) {
        <li
          class="product-challenges-item"
          [class.product-challenges-item-dark]="tone(i) === 'dark'"
          [class.product-challenges-item-brand]="tone(i) === 'brand'"
          [attr.data-id]="item.id"
        >
          <article class="product-challenges-card">
            <span class="product-challenges-icon-wrap" aria-hidden="true">
              @if (item.icon?.url) {
                <img
                  class="product-challenges-icon"
                  [src]="item.icon!.url"
                  alt=""
                  width="24"
                  height="24"
                  loading="lazy"
                  decoding="async"
                />
              }
            </span>
            <div class="product-challenges-copy">
              <h3 class="product-challenges-card-title">{{ item.title }}</h3>
              @if (item.short_description) {
                <p class="product-challenges-card-description">{{ item.short_description }}</p>
              }
            </div>
          </article>
        </li>
      }
    </ul>
  </div>
</section>
