<section class="product-hero" aria-labelledby="product-hero-title">
  <div class="container product-hero-inner">
    <div class="row g-4 align-items-center justify-content-between">
      <div class="col-lg-5">
        <div class="product-hero-copy">
          <h1 id="product-hero-title" class="product-hero-title">{{ title() }}</h1>
          <p class="product-hero-description">{{ description() }}</p>
          <ct-button
            [label]="buttonLabel()"
            variant="dark"
            icon="double-alt-arrow-left"
            layout="spread"
            fontWeight="500"
            (clicked)="ctaClick.emit()"
          />
        </div>
      </div>

      <div class="col-lg-5">
        <div class="product-hero-media">
          @if (image()?.url) {
            <img
              class="product-hero-image"
              [src]="image()?.url"
              [alt]="imageAlt() ?? title()"
              [attr.title]="imageTitle() || null"
              loading="lazy"
              decoding="async"
            />
          }
        </div>
      </div>
    </div>
  </div>
</section>
