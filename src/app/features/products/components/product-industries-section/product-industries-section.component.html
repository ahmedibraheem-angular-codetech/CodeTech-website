<section class="product-industries" aria-labelledby="product-industries-title">
  <div class="container">
    <div class="product-industries-panel">
      <header class="product-industries-header">
        <div class="product-industries-intro">
          <ct-divider [label]="label()" />
          <h2 id="product-industries-title" class="product-industries-title">
            {{ title() }}
          </h2>
        </div>

        <ct-slider-arrows
          [canPrev]="canPrev()"
          [canNext]="canNext()"
          (prev)="prev()"
          (next)="next()"
        />
      </header>

      <div #swiperRoot class="swiper product-industries-swiper">
        <div class="swiper-wrapper">
          @for (item of items(); track item.id) {
            <div class="swiper-slide product-industries-slide">
              <article class="product-industries-card">
                @if (item.image?.url) {
                  <img
                    class="product-industries-image"
                    [src]="item.image?.url"
                    alt=""
                    width="240"
                    height="320"
                    loading="lazy"
                    decoding="async"
                  />
                }
              </article>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
