<section class="product-interfaces" aria-labelledby="product-interfaces-title">
  <div class="container">
    <div class="row g-0 align-items-stretch product-interfaces-body">
      <div class="col-12 col-lg-6 product-interfaces-content">
        <header class="product-interfaces-intro">
          <ct-divider [label]="data().label" />
          <h2 id="product-interfaces-title" class="product-interfaces-title">
            {{ data().title }}
          </h2>
        </header>

        <div class="product-interfaces-tabs" role="tablist" [attr.aria-label]="data().title">
          @for (row of tabRows(); track $index) {
            <div class="product-interfaces-tabs-row">
              @for (item of row; track item.id) {
                <button
                  type="button"
                  class="product-interfaces-tab"
                  role="tab"
                  [class.product-interfaces-tab-active]="isActive(item)"
                  [attr.aria-selected]="isActive(item)"
                  (click)="select(item)"
                >
                  {{ item.tabLabel }}
                </button>
              }
            </div>
          }
        </div>

        @for (active of activeItems(); track active.id) {
          <article class="product-interfaces-about">
            <h3 class="product-interfaces-about-label">{{ active.aboutLabel }}</h3>
            <span class="product-interfaces-about-line" aria-hidden="true"></span>
            <p class="product-interfaces-about-description">{{ active.description }}</p>
          </article>
        }
      </div>

      <div class="col-12 col-lg-6 product-interfaces-media-col">
        @for (active of activeItems(); track active.id) {
          <div class="product-interfaces-media">
            <img
              class="product-interfaces-image"
              [src]="active.imageSrc"
              [alt]="active.imageAlt"
              width="605"
              height="480"
              loading="lazy"
              decoding="async"
            />
          </div>
        }
      </div>
    </div>
  </div>
</section>
