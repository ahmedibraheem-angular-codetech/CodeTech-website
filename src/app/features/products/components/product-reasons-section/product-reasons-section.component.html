<section class="product-reasons" aria-labelledby="product-reasons-title">
  <div class="container">
    <header class="product-reasons-header">
      <div class="product-reasons-intro">
        <ct-divider [label]="data().label" variant="white" />
        <h2 id="product-reasons-title" class="product-reasons-title">{{ data().title }}</h2>
      </div>

      <ct-slider-arrows
        [canPrev]="canPrev()"
        [canNext]="canNext()"
        (prev)="prev()"
        (next)="next()"
      />
    </header>

    <div #swiperRoot class="swiper product-reasons-swiper">
      <div class="swiper-wrapper">
        @for (item of data().items; track item.id) {
          <div class="swiper-slide product-reasons-slide">
            <ct-info-card
              class="product-reasons-card"
              [icon]="item.iconSrc"
              [minHeight]="'22rem'"
              [data]="{ title: item.title, description: item.description }"
            />
          </div>
        }
      </div>
    </div>
  </div>
</section>
