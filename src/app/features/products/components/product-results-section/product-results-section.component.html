<section class="product-results" aria-labelledby="product-results-title">
  <div class="container">
    <div class="product-results-panel">
      <header
        class="product-results-header"
        [style.background-image]="
          'linear-gradient(0deg, rgba(0, 41, 81, 0.4) 0%, rgba(0, 41, 81, 0.4) 100%), url(' +
          backgroundSrc +
          ')'
        "
      >
        <ct-divider [label]="label()" variant="white" />
        <h2 id="product-results-title" class="product-results-title">{{ title() }}</h2>
      </header>

      <div class="product-results-grid">
        <div class="row g-0">
          @for (item of items(); track item.id; let i = $index) {
            <div
              class="col-12 col-sm-6 col-lg-4 product-results-cell"
              [class.product-results-cell-row-end]="i % 3 === 2"
              [class.product-results-cell-last-row]="i >= 3"
              [style.animation-delay]="0.06 * (i + 1) + 's'"
            >
              <article class="product-results-card">
                <span class="product-results-card-icon-wrap" aria-hidden="true">
                  @if (item.icon?.url) {
                    <img
                      class="product-results-card-icon"
                      [src]="item.icon!.url"
                      alt=""
                      width="24"
                      height="24"
                      loading="lazy"
                      decoding="async"
                    />
                  }
                </span>
                <div class="product-results-card-copy">
                  <h3 class="product-results-card-title">{{ item.title }}</h3>
                  <p class="product-results-card-description">{{ item.short_description }}</p>
                </div>
              </article>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
