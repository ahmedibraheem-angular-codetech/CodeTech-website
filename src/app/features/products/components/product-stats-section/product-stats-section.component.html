<section class="product-stats" aria-labelledby="product-stats-title">
  <div class="container">
    <header class="product-stats-intro">
      <ct-divider [label]="label()" />
      <h2 id="product-stats-title" class="product-stats-title">{{ title() }}</h2>
    </header>

    <ul class="product-stats-grid">
      @for (item of items(); track item.id) {
        <li class="product-stat" [class.product-stat-brand]="!!item.background?.url">
          @if (item.background?.url) {
            <img
              class="product-stat-photo"
              [src]="item.background?.url"
              alt=""
              loading="lazy"
              decoding="async"
            />
            <span class="product-stat-shade" aria-hidden="true"></span>
          }

          <div class="product-stat-top">
            <span class="product-stat-title">{{ item.title }}</span>
          </div>

          <p class="product-stat-value">{{ countLabel(item) }}</p>
        </li>
      }
    </ul>
  </div>
</section>
