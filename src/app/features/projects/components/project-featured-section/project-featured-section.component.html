<section class="project-featured" aria-labelledby="project-featured-title">
  <div class="container">
    <header class="project-featured-intro">
      <ct-divider [label]="label()" />
      <h2 id="project-featured-title" class="project-featured-title">{{ title() }}</h2>
    </header>

    <ul class="project-featured-list">
      <li class="project-featured-card">
        @if (imageSrc()) {
          <img
            class="project-featured-image"
            [src]="imageSrc()"
            [alt]="imageAlt()"
            loading="lazy"
            decoding="async"
          />
        }
        <span class="project-featured-shade" aria-hidden="true"></span>

        <div class="project-featured-content">
          <div class="project-featured-copy">
            <h3 class="project-featured-name">{{ project().title }}</h3>
            <p class="project-featured-description">{{ project().description }}</p>

            @if (project().tags.length) {
              <ul class="project-featured-tags">
                @for (tag of project().tags; track tag.id) {
                  <li class="project-featured-tag">
                    @if (tag.icon?.url) {
                      <img
                        class="project-featured-tag-icon"
                        [src]="tag.icon?.url"
                        alt=""
                        loading="lazy"
                        decoding="async"
                      />
                    }
                    <span>{{ tag.title }}</span>
                  </li>
                }
              </ul>
            }
          </div>

          <ct-button
            class="project-featured-cta"
            [label]="ctaLabel()"
            icon="double-alt-arrow-left"
            (clicked)="onCtaClick()"
          />
        </div>
      </li>
    </ul>
  </div>
</section>
