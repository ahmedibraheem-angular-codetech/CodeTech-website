<section class="project-features" aria-labelledby="project-features-title">
  <div class="container">
    <div class="project-features-panel">
      <div class="project-features-header">
        <div class="project-features-intro">
          <ct-divider [label]="data().label" />
          <h2 id="project-features-title" class="project-features-title">
            {{ data().title }}
          </h2>
        </div>

        <ct-slider-arrows
          class="project-features-arrows"
          [canPrev]="canPrev()"
          [canNext]="canNext()"
          (prev)="prev()"
          (next)="next()"
        />
      </div>

      <div #swiperRoot class="swiper project-features-swiper">
        <div class="swiper-wrapper">
          @for (item of data().items; track item.id) {
            <div class="swiper-slide project-features-slide">
              <article class="project-features-card">
                <div class="project-features-copy">
                  <h3 class="project-features-card-title">{{ item.title }}</h3>
                  <p class="project-features-card-text">{{ item.description }}</p>
                </div>
                <div class="project-features-media">
                  <img
                    class="project-features-image"
                    [src]="item.imageSrc"
                    [alt]="item.imageAlt"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </article>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
