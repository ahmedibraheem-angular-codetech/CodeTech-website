<section class="project-results" aria-labelledby="project-results-title">
  <div class="container">
    <div class="project-results-panel">
      <header class="project-results-intro">
        <ct-divider [label]="data().label" />
        <h2 id="project-results-title" class="project-results-title">{{ data().title }}</h2>
      </header>

      <div class="project-results-grid">
        @for (item of data().items; track item.id) {
          <article class="project-results-card" [class]="'project-results-card project-results-card-' + item.id">
            <div class="project-results-head">
              <p class="project-results-value">{{ item.value }}</p>
              <img class="project-results-icon" [src]="item.iconSrc" alt="" />
            </div>
            <p class="project-results-label">{{ item.label }}</p>
          </article>
        }
      </div>
    </div>
  </div>
</section>
