<section class="project-results" aria-labelledby="project-results-title">
  <div class="container">
    <div class="project-results-panel">
      <header class="project-results-intro">
        <ct-divider [label]="label()" />
        <h2 id="project-results-title" class="project-results-title">{{ title() }}</h2>
      </header>

      <div class="project-results-grid">
        @for (item of items(); track item.id; let i = $index) {
          <article class="project-results-card" [class]="'project-results-card project-results-card-' + areas[i]">
            <div class="project-results-head">
              <p class="project-results-value">{{ item.value }}</p>
              @if (item.icon?.url) {
                <img
                  class="project-results-icon"
                  [src]="item.icon?.url"
                  alt=""
                  loading="lazy"
                  decoding="async"
                />
              }
            </div>
            <p class="project-results-label">{{ item.title }}</p>
          </article>
        }
      </div>
    </div>
  </div>
</section>
