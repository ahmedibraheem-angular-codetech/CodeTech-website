<section class="project-screens" [attr.aria-label]="title()">
  <div class="container">
    <div class="project-screens-gallery">
      <div class="project-screens-thumbs-clip">
      <div #thumbsRoot class="swiper project-screens-thumbs">
        <div class="swiper-wrapper">
          @for (item of items(); track item.id) {
            <div class="swiper-slide project-screens-thumb-slide">
              <button type="button" class="project-screens-thumb" [attr.aria-label]="title()">
                <img
                  class="project-screens-thumb-image"
                  [src]="item.image.url"
                  [alt]="title()"
                  loading="lazy"
                  decoding="async"
                />
              </button>
            </div>
          }
        </div>
      </div>
      </div>

      <div #mainRoot class="swiper project-screens-main">
        <div class="swiper-wrapper">
          @for (item of items(); track item.id) {
            <div class="swiper-slide project-screens-main-slide">
              <article class="project-screens-main-card">
                <img
                  class="project-screens-main-image"
                  [src]="item.image.url"
                  [alt]="title()"
                  loading="lazy"
                  decoding="async"
                />
              </article>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
