<section class="project-solution" aria-labelledby="project-solution-title">
  <div class="container">
    <div class="project-solution-layout">
      <header class="project-solution-intro">
        <ct-divider [label]="label()" />
        <h2 id="project-solution-title" class="project-solution-title">{{ title() }}</h2>
      </header>

      <div class="project-solution-panel">
        <ul class="project-solution-grid">
          @for (cell of cells(); track cell.id; let i = $index) {
            <li
              class="project-solution-cell"
              [class.project-solution-cell-media]="!cell.solution"
              [class.project-solution-cell-end]="i % 3 === 2"
              [class.project-solution-cell-last-row]="i >= 3"
            >
              @if (cell.solution; as solution) {
                <article class="project-solution-card">
                  @if (solution.icon?.url; as iconUrl) {
                    <span class="project-solution-icon-wrap" aria-hidden="true">
                      <img
                        class="project-solution-icon"
                        [src]="iconUrl"
                        alt=""
                        width="24"
                        height="24"
                        loading="lazy"
                        decoding="async"
                      />
                    </span>
                  }
                  <h3 class="project-solution-card-title">{{ solution.title }}</h3>
                  <p class="project-solution-card-text">{{ solution.short_description }}</p>
                </article>
              } @else {
                <article class="project-solution-media" [attr.aria-label]="imageTitle()">
                  <img
                    class="project-solution-media-image"
                    [src]="image()?.url"
                    [alt]="imageAlt() ?? ''"
                    loading="lazy"
                    decoding="async"
                  />
                </article>
              }
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
