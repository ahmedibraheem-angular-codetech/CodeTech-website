<section class="project-stats" aria-labelledby="project-stats-title">
  <div class="container">
    <header class="project-stats-intro">
      <ct-divider [label]="label()" />
      <h2 id="project-stats-title" class="project-stats-title">{{ title() }}</h2>
    </header>

    <ul class="project-stats-grid">
      @for (item of items(); track item.id; let i = $index) {
        <li
          class="project-stat"
          [class.project-stat-brand]="i === 3"
          [class.project-stat-media]="i === 1"
        >
          @if (i === 1) {
            <img
              class="project-stat-photo"
              [src]="mediaImageSrc"
              alt=""
              loading="lazy"
              decoding="async"
            />
            <span class="project-stat-shade" aria-hidden="true"></span>
          }

          @if (i === 3) {
            <div class="project-stat-brand-head">
              @if (cardIconSrcs[i]) {
                <span class="project-stat-icon">
                  <img [src]="cardIconSrcs[i]" alt="" loading="lazy" decoding="async" />
                </span>
              }
              <p class="project-stat-value">{{ countLabel(item) }}</p>
            </div>
            <span class="project-stat-title">{{ item.title }}</span>
          } @else {
            <div class="project-stat-top">
              @if (cardIconSrcs[i]) {
                <span class="project-stat-icon">
                  <img [src]="cardIconSrcs[i]" alt="" loading="lazy" decoding="async" />
                </span>
              }
              <span class="project-stat-title">{{ item.title }}</span>
            </div>

            <p class="project-stat-value">{{ countLabel(item) }}</p>
          }
        </li>
      }
    </ul>
  </div>
</section>
