<section
  class="solutions-section"
  aria-labelledby="solutions-section-title"
>
  <div class="container">
    <div class="solutions-panel">
      <div class="solutions-header">
        <ct-divider [label]="label()" />
        <h2 id="solutions-section-title" class="solutions-title">
          {{ title() }}
        </h2>
      </div>

      <div class="solutions-grid">
        <div class="row g-0">
          @for (item of solutions(); track item.id; let i = $index) {
            <div
              class="col-12 col-md-4 solutions-grid-cell"
              [class.solutions-grid-cell-first]="i === 0"
            >
              <ct-info-card
                class="solutions-info-card"
                [icon]="item.icon?.url ?? ''"
                [minHeight]="'13rem'"
                [data]="{ title: item.title, description: item.short_description }"
              />
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
