<section class="stages-section" aria-labelledby="stages-section-title">
  <div class="container">
    <ct-divider [label]="label()" />

    <h2 id="stages-section-title" class="stages-title">{{ title() }}</h2>

    <div class="row g-2 row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-6">
      @for (stage of stages(); track stage.id; let i = $index) {
        <div class="col">
          <ct-step-card
            [number]="(i + 1).toString().padStart(2, '0')"
            [title]="stage.title"
            [description]="stage.short_description"
          />
        </div>
      }
    </div>
  </div>
</section>
