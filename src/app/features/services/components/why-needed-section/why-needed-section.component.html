<section
  class="why-needed-section"
  aria-labelledby="why-needed-section-title"
>
  <div class="container">
    <div class="">
      <div class="row g-5 align-items-stretch">
        <div class="col-lg-5">
          <div class="why-needed-visual">
            @if (image()?.url) {
              <img
                class="why-needed-image"
                [src]="image()?.url"
                [alt]="title()"
                loading="lazy"
                decoding="async"
              />
            }

            @if (imageText()) {
              <p class="why-needed-caption">
                {{ imageText() }}
              </p>
            }
          </div>
        </div>

        <div class="col-lg-7 why-needed-panel">
          <div class="why-needed-copy">
            <ct-divider [label]="label()" />

            <h2 id="why-needed-section-title" class="why-needed-title">
              {{ title() }}
            </h2>

            <ul class="why-needed-cards">
              @for (item of needs(); track item.id) {
                <li class="why-needed-card">
                  @if (item.icon?.url) {
                    <span class="why-needed-card-icon-wrap" aria-hidden="true">
                      <img
                        class="why-needed-card-icon"
                        [src]="item.icon!.url"
                        alt=""
                        width="24"
                        height="24"
                        loading="lazy"
                        decoding="async"
                      />
                    </span>
                  }
                  <span class="why-needed-card-title">{{ item.title }}</span>
                </li>
              }
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
