<section class="industries-section" aria-labelledby="industries-section-title">
  <div class="container">
    <ct-divider [label]="label()" />
    <h2 id="industries-section-title" class="industries-title">
      {{ title() }}
    </h2>

    <ul class="industries-grid">
      @for (item of items(); track item.id) {
        <li class="industries-card">
          @if (item.image?.url) {
            <img
              class="industries-image"
              [src]="item.image?.url"
              alt=""
              loading="lazy"
              decoding="async"
            />
          }
        </li>
      }
    </ul>
  </div>
</section>
