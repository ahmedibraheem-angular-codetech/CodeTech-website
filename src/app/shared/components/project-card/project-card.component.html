<article class="project-card" [class.is-active]="active()">
  <div class="project-card-media">
    @if (imageSrc()) {
      <img
        class="project-card-image"
        [src]="imageSrc()"
        [alt]="imageAlt()"
        loading="lazy"
        decoding="async"
      />
    }
  </div>

  <div class="project-card-body">
    <h3 class="project-card-name">
      <a class="project-card-link" [routerLink]="detailLink()">{{ data().title }}</a>
    </h3>
    <p class="project-card-description">{{ data().description }}</p>

    @if (tags().length) {
      <ul class="project-card-tools">
        @for (tag of tags(); track tag.id) {
          <li class="project-card-tool">
            @if (tag.icon?.url) {
              <img
                class="project-card-icon"
                [src]="tag.icon!.url"
                alt=""
                width="20"
                height="20"
                loading="lazy"
                decoding="async"
                aria-hidden="true"
              />
            }
            {{ tag.title }}
          </li>
        }
      </ul>
    }
  </div>
</article>
