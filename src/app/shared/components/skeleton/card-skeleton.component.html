@switch (variant()) {
  @case ('project') {
    <article class="card-skeleton card-skeleton-project" aria-hidden="true">
      <div class="card-skeleton-media">
        <ct-skeleton [block]="true" [radius]="'var(--border-radius)'" />
      </div>
      <div class="card-skeleton-body">
        <ct-skeleton width="62%" height="1rem" />
        <ct-skeleton width="100%" height="0.75rem" />
        <ct-skeleton width="78%" height="0.75rem" />
      </div>
    </article>
  }
  @default {
    <article class="card-skeleton card-skeleton-info" aria-hidden="true">
      <ct-skeleton width="48px" height="48px" radius="12px" />
      <div class="card-skeleton-copy">
        <ct-skeleton width="68%" height="1rem" />
        <ct-skeleton width="100%" height="0.75rem" />
        <ct-skeleton width="84%" height="0.75rem" />
      </div>
    </article>
  }
}
